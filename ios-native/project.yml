# ios-native — XcodeGen project spec.
#
# After editing this file, regenerate the Xcode project with:
#   cd ios-native && xcodegen
# This rewrites MyBookLab.xcodeproj from scratch.

name: MyBookLab
options:
  bundleIdPrefix: com.myfavoritebook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.local.xcconfig
  Release: Config.local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G53XBRCRVU
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios-spm
    from: 24.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  MyBookLab:
    type: application
    platform: iOS
    sources:
      - path: MyBookLab
    resources:
      - path: MyBookLab/Resources
    info:
      path: MyBookLab/Info.plist
      properties:
        CFBundleDisplayName: My Book Lab
        # Pull version/build from the MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION build settings. Without these, XcodeGen
        # injects its defaults (1.0 / 1) and the build ships as 1.0.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # iOS 14+ UILaunchScreen dictionary — declarative launch screen
        # without a separate .storyboard file. We keep it as a solid
        # cosmic-purple color and skip the image — UILaunchScreen
        # renders any image at its native size, and our logo is
        # 1024×1024, which would balloon to fill the entire screen.
        # The first SwiftUI frame paints the real CosmicBackground +
        # logo almost instantly anyway.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait-only on iPhone. iPad requires all four orientations
        # unless we declare full-screen-required, which we do — the app
        # is designed as a focused storytelling experience, not a
        # multi-tasking productivity tool.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Used to take a photo for your cartoon avatar. The original photo is never saved — only the cartoon version is kept."
        NSPhotoLibraryUsageDescription: "Used to pick a photo for your cartoon avatar. The original photo is never saved — only the cartoon version is kept."
        NSMicrophoneUsageDescription: "Used to dictate your story when you tap the microphone button."
        NSFaceIDUsageDescription: "Used to securely sign you back in to your account."
        ITSAppUsesNonExemptEncryption: false
        # Live Activity (print-order tracking) — see
        # Services/PrintOrderActivityManager.swift.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.myfavoritebook.app.oauth
            CFBundleURLSchemes:
              - com.myfavoritebook.app
          # Short scheme used by the widget + Spotlight to deep-link
          # into a tab (mybooklab://create, mybooklab://books).
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.myfavoritebook.app.deeplink
            CFBundleURLSchemes:
              - mybooklab
        # Secrets only — base URLs are hardcoded in AppConfig.swift to
        # avoid the xcconfig "//" escaping trap. These come from
        # Config.local.xcconfig (gitignored). See ios-native/README.md.
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GOOGLE_SIGN_IN_CLIENT_ID: $(GOOGLE_SIGN_IN_CLIENT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        GIDClientID: $(GOOGLE_SIGN_IN_CLIENT_ID)
        # Optional: point the app at a Vercel Preview deployment for
        # testing (hostname only, no https://). Blank = mybooklab.app.
        API_BASE_HOST: $(API_BASE_HOST)
    entitlements:
      path: MyBookLab/MyBookLab.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # App Attest (Services/AppAttest.swift). "production" is correct
        # for both: dev-signed builds are routed to Apple's development
        # attestation environment by their provisioning profile.
        com.apple.developer.devicecheck.appattest-environment: production
        # Shared storage for the widget (create the App Group with this
        # exact id in the Apple Developer portal before building).
        com.apple.security.application-groups:
          - group.com.myfavoritebook.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myfavoritebook.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons unlockable in-app (AppIconPickerView). Names
        # match the .appiconset folders in Assets.xcassets; Xcode 13+
        # wires CFBundleAlternateIcons automatically from these.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconRocket AppIconRainbow AppIconNight
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: StripePaymentSheet
        product: StripePaymentSheet
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: MyBookLabWidgets
        embed: true

  # Home-screen widget + print-order Live Activity. Shares data with
  # the app via the App Group (WidgetShared.swift compiles into both).
  MyBookLabWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MyBookLabWidgets
      - path: MyBookLab/Services/WidgetShared.swift
    entitlements:
      path: MyBookLabWidgets/MyBookLabWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.myfavoritebook.app
    info:
      path: MyBookLabWidgets/Info.plist
      properties:
        CFBundleDisplayName: My Book Lab
        # An app-extension's CFBundleVersion / CFBundleShortVersionString
        # MUST match the parent app's, or the build is rejected. Track the
        # same build settings the app target uses so bumping the version
        # in one place (settings.base below) keeps both in lockstep —
        # without these, XcodeGen hardcodes the widget to version "1".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myfavoritebook.app.widgets
